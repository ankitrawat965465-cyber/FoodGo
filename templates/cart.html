<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - FoodGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="nav">

    <a class="brand" href="/">🍕 FoodGo</a>

    <nav>
        <a href="/">Home</a>
        <a href="/cart">🛒 Cart</a>
    </nav>

</header>

<main class="container narrow">

    <h1>Your Cart</h1>

    {% if items %}

    <div class="cart-box">

        {% for item in items %}

        <div class="cart-row">

            <div>
                <h3>{{ item.name }}</h3>
                <small>{{ item.restaurant }}</small>
            </div>

            <strong>₹{{ item.price }}</strong>

        </div>

        {% endfor %}

        <div class="total">
            <span>Total</span>
            <strong>₹{{ total }}</strong>
        </div>

        <a class="btn full" href="/checkout">
            Continue to Checkout
        </a>

        <form method="post" action="/cart/clear">

            <button class="link-btn" type="submit">
                Clear Cart
            </button>

        </form>

    </div>

    {% else %}

    <div class="empty">

        <h2>Your cart is empty 🍕</h2>

        <p>
            Add something delicious from a restaurant.
        </p>

        <a class="btn" href="/">
            Browse Restaurants
        </a>

    </div>

    {% endif %}

</main>

</body>
</html>
