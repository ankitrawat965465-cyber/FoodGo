name: FoodGo Secrets Scan

on:
  workflow_call:

jobs:
  gitleaks:
    name: Scan for exposed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FoodGo repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2  #Gitleaks ek security tool hai jo code aur Git history mein leaked secrets dhoondhta hai.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}