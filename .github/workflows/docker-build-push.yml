name: FoodGo Docker Build and Push

on:
  workflow_call:

jobs:
  docker-build-push:
    name: Build and Push FoodGo Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FoodGo code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx                #Docker image build karne ka setup karta hai
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub                #Docker Hub mein authenticate karta hai
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image     #Image build karke Docker Hub par upload karta hai
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghurka/foodgo:latest