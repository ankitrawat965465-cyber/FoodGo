name: FoodGo Docker Image Scan

on:
  workflow_call:

jobs:
  image-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FoodGo code
        uses: actions/checkout@v4

      - name: Build FoodGo Docker image   #Docker image banata hai.
        run: docker build -t foodgo-app:${{ github.sha }} .  #-t — image ko naam aur tag deta hai.
      #{{ github.sha }} — jis Git commit par workflow chal raha hai, uska unique commit hash.
      - name: Scan image with Trivy           #Image ki vulnerabilities scan karta hai
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodgo-app:${{ github.sha }}  #Kaunsi image scan karni hai.
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH     #Sirf high aur critical severity issues report karta hai
          exit-code: '1'              #High/critical finding milne par job fail kar sakta hai