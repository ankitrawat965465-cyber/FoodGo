apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodgo
  namespace: foodgo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: foodgo

  template:
    metadata:
      labels:
        app: foodgo

    spec:
      containers:
        - name: foodgo
          image: foodgo-app:latest
          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: foodgo-config
            - secretRef:
                name: foodgo-secret

          ports:
            - containerPort: 8080
          
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:      #Application healthy hai ya nahi, check karta hai.
            httpGet:          #HTTP request bhej kar health check karta hai.
              path: /         #FoodGo ke home page / ko check karega.
              port: 8080              #Application ke port 8080 par request bhejega.
            initialDelaySeconds: 10   #Container start hone ke 10 seconds baad check shuru karega.
            periodSeconds: 10        #Har 10 seconds mein check karega.
            timeoutSeconds: 2         #Response ke liye maximum 2 seconds wait karega.
            failureThreshold: 3       #Lagatar 3 checks fail hone par container ko restart karne ki koshish karega.
